services:
  web:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./miniapp:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  api:
    build: .
    command: ["python", "-m", "legal_bot.api"]
    env_file: .env.production
    expose:
      - "8080"
    volumes:
      - legalbot_data:/data
    restart: unless-stopped

  bot:
    build: .
    command: ["python", "-m", "legal_bot.main"]
    env_file: .env.production
    volumes:
      - legalbot_data:/data
    restart: unless-stopped

volumes:
  legalbot_data:
